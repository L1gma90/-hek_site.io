<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация продукта</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

    <div class="container">
        
        <div class="left">
            <span class="brand-tag">т.интерфейс</span>
            <h1>Меньше слов.<br>Больше цифры.</h1>
            <p>
                Мы убрали из банкинга всё лишнее. Оставили только чистую скорость, прозрачный кэшбэк и тяжелый пластик, который приятно держать в руках. Без скрытых условий.
            </p>
            <button class="main-button">Выпустить карту</button>
        </div>
        
        <div class="right">
            
            <div class="model-switcher">
                <button id="btn-card" class="switch-btn active">Карта</button>
                <button id="btn-coin" class="switch-btn">Монета</button>
            </div>

            <model-viewer
                id="view-card"
                src="card.glb"
                camera-controls
                auto-rotate
                interaction-prompt="none"
                exposure="1.3">
            </model-viewer>

            <model-viewer
                id="view-coin"
                src="coin.glb"
                camera-controls
                auto-rotate
                interaction-prompt="none"
                exposure="1.2"
                style="display: none;">
            </model-viewer>

        </div>
    </div>

    <script>
        const btnCard = document.getElementById('btn-card');
        const btnCoin = document.getElementById('btn-coin');
        const viewCard = document.getElementById('view-card');
        const viewCoin = document.getElementById('view-coin');

        btnCard.addEventListener('click', () => {
            btnCard.classList.add('active');
            btnCoin.classList.remove('active');
            viewCard.style.display = 'block';
            viewCoin.style.display = 'none';
        });

        btnCoin.addEventListener('click', () => {
            btnCoin.classList.add('active');
            btnCard.classList.remove('active');
            viewCard.style.style.display = 'none';
            viewCoin.style.display = 'block';
        });
    </script>
</body>
</html>
